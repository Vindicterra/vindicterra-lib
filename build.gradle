plugins {
    id 'java'
    id "com.vanniktech.maven.publish" version "0.37.0"
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'net.vindicterra'
version = '0.2.3-dev'

mavenPublishing {
    publishToMavenCentral(true, false)
    signAllPublications()

    coordinates(project.group.toString(), project.name, project.version.toString())
    pom {
        name.set("${project.group}:${project.name}")
        description.set("Core library for all Vindicterra plugins")
        url.set("play.vindicterra.net")

        licenses {
            license {
                name.set("GNU GPL-3.0 License")
                url.set("https://www.gnu.org/licenses/gpl-3.0.en.html")
            }
        }

        developers {
            developer {
                name.set("Shradinx")
                email.set("luphcore@gmail.com")
            }
            developer {
                name.set("bearofbusiness")
                email.set("")
            }
        }

        scm {
            url.set("https://github.com/Vindicterra/vindicterra-lib")
            connection.set("scm:git:git://github.com/Vindicterra/vindicterra-lib")
            developerConnection.set("scm:git:ssh://git@github.com:Vindicterra/vindicterra-lib.git")
        }
    }
}

